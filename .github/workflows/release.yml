name: Build and Release C Project

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set Version Environment Variable
      shell: bash
      run: |
        TAG_NAME="${{ github.ref_name }}"
        VERSION="${TAG_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Compile Code (Windows)
      if: matrix.os == 'windows-latest'
      run: mingw32-make TARGET=thom-${{ env.VERSION }}-windows-avx2.exe

    - name: Compile Code (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: make TARGET=thom--${{ env.VERSION }}-linux-avx2

    - name: Upload Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: |
          thom-${{ env.VERSION }}-windows-avx2.exe
          thom-${{ env.VERSION }}-linux-avx2
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set Version Environment Variable
      shell: bash
      run: |
        TAG_NAME="${{ github.ref_name }}"
        VERSION="${TAG_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          artifacts/thom-${{ env.VERSION }}-windows-avx2.exe
          artifacts/thom-${{ env.VERSION }}-linux-avx2
